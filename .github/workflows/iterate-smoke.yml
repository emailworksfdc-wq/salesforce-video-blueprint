name: Iterate Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here needs write access.
permissions:
  contents: read

jobs:
  iterate-smoke:
    name: offline iterate smoke (no org)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Derive the spec from the example capture
        # The CLI pipeline produces the input spec that the iterate loop refines.
        # Uses the same example capture that the pipeline-smoke job uses, so the
        # two smoke runs measure the same data path end-to-end.
        run: |
          python -m sf_video_blueprint.cli run \
            --capture examples/case_triage.dom_capture.jsonl \
            --org-url "https://example-dev.develop.my.salesforce.com" \
            --output-path outputs/iterate_smoke.html \
            --spec-output outputs/iterate_smoke.agent-spec.json

      - name: Run the iterate loop (offline, max 3 rounds)
        # Drives iterate.refine with use_cli=False: no org, no LLM, no network.
        # Checks that the loop runs, writes versioned specs, and writes a report.
        run: |
          python scripts/run_iterate_smoke.py \
            outputs/iterate_smoke.agent-spec.json \
            --out outputs/iterate_out \
            --max-rounds 3

      - name: Check the iterate contracts
        # Asserts: v1/agent-spec.json exists, provenance is present,
        # iteration_report.json is structurally valid.
        # See the script's docstring for why each property matters.
        run: |
          python scripts/iterate_smoke_check.py \
            outputs/iterate_out \
            --out outputs/iterate_smoke_check_result.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iterate-smoke-output
          path: outputs/
          retention-days: 7
