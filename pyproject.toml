[project]
name = "sf-video-blueprint"
version = "0.1.1"
description = "Pipeline to convert Salesforce workflow videos into a traceable HTML blueprint."
readme = "README.md"
requires-python = ">=3.11"
# Pinning policy: lower bounds with a major-version ceiling. This is a
# library-plus-CLI, so runtime pins stay loose enough to install alongside other
# packages.
#
# The lower bounds are NOT arbitrary — they are the floors that actually build on
# Python 3.12 and 3.13. A tighter `playwright~=1.46` pulls in an old greenlet
# whose C extension fails to compile against the 3.12+ C API (_PyCFrame removed),
# which breaks installation entirely on modern interpreters. Do not lower these
# without checking a 3.13 build.
dependencies = [
  "jinja2>=3.1.4,<4",
  "playwright>=1.55,<2",
  "pydantic>=2.8.2,<3",
  "requests>=2.32.3,<3",
  "typer>=0.12.3,<1",
]

[project.optional-dependencies]
# mcp: the Model Context Protocol server (sf-blueprint-mcp), which exposes the
# pipeline to any MCP-capable AI harness. Optional rather than a hard runtime dep
# because the CLI and library work without it, and `mcp` pulls in a web stack
# (starlette, uvicorn, httpx) that a CLI-only user should not have to install.
mcp = [
  "mcp>=1.28,<2",
]
dev = [
  # Lower bound rather than an exact pin: an exact pytest pin makes the package
  # uninstallable alongside any other project that pins a different patch.
  "pytest>=8.0,<10",
  # pyyaml: enables round-trip validation of hand-rolled YAML emitters in
  # agentforce_spec.py and eval_spec.py. Currently those modules emit YAML via
  # string concatenation but never parse their own output — a verification gap.
  # Dev-only: not needed at runtime, preserves zero-runtime-dep property.
  "pyyaml~=6.0",
  # jsonschema: enables enforcement of the JSON schemas in docs/schemas/.
  # Currently the schemas are unenforced design docs (test_schemas.py has a
  # minimal hand-rolled validator). Adding jsonschema as dev-only closes the
  # verification gap without adding a runtime dep.
  "jsonschema~=4.17",
]

[project.scripts]
sf-blueprint = "sf_video_blueprint.cli:app"
# Declared unconditionally even though it needs the [mcp] extra: an entry point
# cannot be conditional, and the module raises a SystemExit naming the install
# command when `mcp` is missing. A clear message beats a bare ImportError.
sf-blueprint-mcp = "sf_video_blueprint.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sf_video_blueprint = ["templates/*.j2"]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"
